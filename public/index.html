<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Taxi Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 p-5">
    <h1 class="text-2xl font-bold mb-4">My Taxi Dashboard</h1>

    <div id="login-form" class="bg-white p-4 rounded shadow mb-5">
        <input id="phone" type="text" placeholder="Phone" class="border p-2 mr-2">
        <input id="pass" type="password" placeholder="Password" class="border p-2 mr-2">
        <button onclick="login()" class="bg-blue-500 text-white p-2 rounded">Login</button>
    </div>

    <div id="map" class="h-96 w-full rounded shadow"></div>

    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([7.3590, 80.6250], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let token = "";

        // 2. Login Logic
        async function login() {
            const phoneNumber = document.getElementById('phone').value;
            const password = document.getElementById('pass').value;

            const res = await fetch('https://my-taxi-app-8m8w.onrender.com/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber, password })
            });

            const data = await res.json();
            if (data.token) {
                token = data.token;
                alert("Login Successful!");
                fetchDrivers();
            } else {
                alert("Login Failed");
            }
        }

        // 3. Fetch & Plot Drivers
        async function fetchDrivers() {
            const res = await fetch('https://my-taxi-app-8m8w.onrender.com/drivers/nearby?lat=7.3590&lng=80.6250', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const drivers = await res.json();

            drivers.forEach(d => {
                L.marker([d.location.coordinates[1], d.location.coordinates[0]])
                 .addTo(map)
                 .bindPopup(`${d.name} (${d.vehicleNumber})`);
            });
        }
    </script>
</body>
</html>
